project:
  type: website
  output-dir: _site
  pre-render: scripts/copy_sim_figures.ts

var:
  url-repo: https://github.com/iic-jku/SG13CMOS_SPARX

website:
  title: "SPARX"
  favicon: fig/favicon.png
  site-url: "https://iic-jku.github.io/SG13CMOS_SPARX/"
  repo-url: "https://github.com/iic-jku/SG13CMOS_SPARX"
  repo-subdir: doc
  repo-branch: main
  repo-actions: [edit, issue]
  navbar:
    background: "#447099"
    search: true
    left:
      - icon: house
        href: index.qmd
        text: "Home"
      - icon: bi-filetype-pdf
        text: PDF
        href: index.pdf
    right:
      - icon: github
        href: "{{< meta var.url-repo >}}"
        target: "_blank"
  page-footer:
    left: |
      [Source code]({{< meta var.url-repo >}}){.external target="_blank"}
    right: |
      Website built with [Quarto](https://quarto.org/){.external target="_blank"}

execute:
  freeze: auto

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: true
    theme:
      light: cosmo
      dark: solar
    css: styles.css
    fig-align: center
    lang: en-US
    lightbox: true
